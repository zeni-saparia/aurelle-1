<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — AURELLE</title><meta name="description" content="AURELLE — luxury home décor. Living, Refined.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css"><script src="/js/config.js"></script></head>
<body data-page="auth"><div id="site-top"></div><main id="main"><div class="auth"><div class="art" style="background-image:url(/assets/site/register.jpg)"><div><h2 style="max-width:12ch">Living, Refined.</h2></div></div>
<div class="panel"><h1 style="font-size:2.8rem">Create your account</h1><p class="muted" style="margin:10px 0 28px">Save favourites, check out faster and track every order.</p><div id="msg" role="alert"></div><form id="form" novalidate><div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" autocomplete="name" required></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" required><button type="button" data-toggle="password" aria-label="Show password"></button></div></div><div class="meter" style="margin:-10px 0 6px"><i id="meter"></i></div><p class="hint muted" id="meter-text" style="font-size:12.5px;margin-bottom:16px">At least 8 characters with a letter and a number.</p>
<div class="field"><label for="confirm_password">Confirm password</label><div class="pw"><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required><button type="button" data-toggle="confirm_password" aria-label="Show password"></button></div></div><button class="btn block" type="submit">Create account</button></form><p class="muted" style="margin-top:22px">Already registered? <a class="link" href="/login.html">Sign in</a></p></div></div></main><div id="site-bottom"></div>
<script type="module" src="/js/pages/auth.js"></script></body></html>
