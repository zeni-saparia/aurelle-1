<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — AURELLE</title><meta name="description" content="AURELLE — luxury home décor. Living, Refined.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css"><script src="/js/config.js"></script></head>
<body data-page="auth"><div id="site-top"></div><main id="main"><div class="auth"><div class="art" style="background-image:url(/assets/site/login.jpg)"><div><h2 style="max-width:12ch">Living, Refined.</h2></div></div>
<div class="panel"><h1 style="font-size:2.8rem">Welcome back</h1><p class="muted" style="margin:10px 0 28px">Sign in to see your orders, wishlist and saved addresses.</p><div id="msg" role="alert"></div><form id="form" novalidate><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" data-toggle="password" aria-label="Show password"></button></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:14px"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="remember" style="accent-color:var(--espresso)"> Remember me</label><a class="link" href="/forgot-password.html">Forgot password?</a></div>
<button class="btn block" type="submit">Sign in</button></form><p class="muted" style="margin-top:22px">New to AURELLE? <a class="link" href="/register.html">Create an account</a></p></div></div></main><div id="site-bottom"></div>
